<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>

    <!-- form: crea un formulario para introducir y enviar datos; action: indica dónde se envían los datos; method: indica cómo se envían los datos -->
    <form action="index.html" method="get">

        <!-- fieldset: agrupa campos relacionados de un formulario -->
        <fieldset>

            <!-- legend: establece el título del grupo de campos -->
            <legend>Datos personales by Quique</legend>
            <!-- label: crea la etiqueta descriptiva de un campo; for: relaciona la etiqueta con el campo mediante su id -->
<label for="nombre">Nombre:</label>

<!-- input: crea un campo de entrada; type: indica el tipo de dato que acepta; id: identifica el campo; name: nombre con el que se envía el dato -->
<!-- text: permite introducir texto; placeholder: muestra un texto de ayuda; required: obliga a rellenar el campo; autofocus: coloca el cursor automáticamente en el campo -->
<!-- size: establece el ancho visible del campo; maxlength: establece el número máximo de caracteres -->
<input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

<br><br>

<!-- password: crea un campo para introducir contraseñas ocultando los caracteres; minlength: establece el número mínimo de caracteres -->
<label for="contrasena">Contraseña:</label>
<input type="password" id="contrasena" name="contrasena" minlength="8">

<br><br>

<!-- email: permite introducir una dirección de correo electrónico y comprobar su formato -->
<label for="correo">Correo electrónico:</label>
<input type="email" id="correo" name="correo" required>

<br><br>

<!-- tel: permite introducir un número de teléfono; pattern: establece un patrón que debe cumplir el valor -->
<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">

<br><br>

<!-- date: permite introducir una fecha -->
<label for="fecha">Fecha de nacimiento:</label>
<input type="date" id="fecha" name="fecha">

<br><br>

<!-- file: permite seleccionar un archivo del dispositivo; accept: limita los tipos de archivo aceptados -->
<label for="foto">Foto:</label>
<input type="file" id="foto" name="foto" accept="image/*">

<br><br>

<!-- readonly: permite ver el valor pero no modificarlo -->
<label for="curso">Curso:</label>
<input type="text" id="curso" name="curso" value="2026-27" readonly>

<br><br>

<!-- disabled: desactiva el campo y evita que su valor se envíe con el formulario -->
<label for="centro">Centro:</label>
<input type="text" id="centro" name="centro" value="IES La Asunción" disabled>

<br><br>

        </fieldset>

        <!-- fieldset: agrupa los campos relacionados de preferencias -->
<fieldset>

    <!-- legend: establece el título del grupo de campos -->
    <legend>Preferencias</legend>

    <!-- radio: permite seleccionar una sola opción entre varias con el mismo name -->
    <p>Turno:</p>

    <label for="manana">Mañana</label>
    <input type="radio" id="manana" name="turno" value="manana">

    <label for="tarde">Tarde</label>
    <input type="radio" id="tarde" name="turno" value="tarde">

    <br><br>

    <!-- checkbox: permite seleccionar una o varias opciones -->
    <p>Intereses:</p>

    <label for="programacion">Programación</label>
    <input type="checkbox" id="programacion" name="intereses" value="programacion">

    <label for="redes">Redes</label>
    <input type="checkbox" id="redes" name="intereses" value="redes">

    <label for="bases-datos">Bases de datos</label>
    <input type="checkbox" id="bases-datos" name="intereses" value="bases-datos">

    <br><br>

    <!-- number: permite introducir un número; min: establece el valor mínimo; max: establece el valor máximo; step: establece el intervalo entre valores -->
<label for="horas">Horas de estudio:</label>
<input type="number" id="horas" name="horas" min="0" max="10" step="2">

<br><br>

<!-- range: crea un control deslizante para seleccionar un valor dentro de un intervalo -->
<label for="nivel">Nivel:</label>
<input type="range" id="nivel" name="nivel" min="1" max="10">

<br><br>

<!-- color: permite seleccionar un color -->
<label for="color">Color favorito:</label>
<input type="color" id="color" name="color">

<br><br>

<!-- time: permite introducir una hora -->
<label for="hora">Hora:</label>
<input type="time" id="hora" name="hora">

<br><br>

<!-- week: permite seleccionar una semana y un año -->
<label for="semana">Semana:</label>
<input type="week" id="semana" name="semana">

<br><br>

<!-- month: permite seleccionar un mes y un año -->
<label for="mes">Mes:</label>
<input type="month" id="mes" name="mes">

<br><br>

<!-- select: crea una lista de opciones; multiple: permite seleccionar varias opciones -->
<label for="modulos">Módulos:</label>
<select id="modulos" name="modulos" multiple>

    <!-- optgroup: agrupa opciones relacionadas; label: establece el nombre visible del grupo -->
    <optgroup label="Módulos de informática">

        <!-- option: crea una opción dentro de un select; value: valor que se envía; selected: selecciona una opción por defecto -->
        <option value="programacion" selected>Programación</option>
        <option value="bases-datos">Bases de datos</option>

    </optgroup>

    <optgroup label="Módulos de sistemas">

        <option value="redes">Redes</option>
        <option value="sistemas-operativos">Sistemas Operativos</option>

    </optgroup>

</select>

<br><br>

<!-- textarea: crea un campo de texto que permite escribir varias líneas; rows: establece el número de filas visibles; cols: establece el número de columnas visibles -->
<label for="comentarios">Comentarios:</label>
<textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>

<br><br>

</fieldset>

<!-- input type="submit": crea un botón que envía el formulario -->
<input type="submit" value="Enviar">

<!-- reset: restablece los campos del formulario a sus valores iniciales -->
<input type="reset" value="Borrar">

<!-- button: crea un botón que no tiene ninguna acción por defecto -->
<input type="button" value="Botón">

<!-- image: crea un botón de envío mediante una imagen; src: indica la imagen que se muestra; alt: proporciona un texto alternativo -->
<input type="image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/120px-Cat03.jpg" alt="Enviar formulario">

<br><br>

<!-- button type="submit": crea un botón que envía el formulario -->
<button type="submit">Enviar con button</button>

<!-- button type="reset": crea un botón que restablece los campos del formulario -->
<button type="reset">Borrar con button</button>

<!-- button type="button": crea un botón sin acción de envío o restablecimiento -->
<button type="button">Botón con button</button>

    </form>

    <!-- form: crea el formulario de búsqueda; action: indica el buscador de Wikipedia; method: envía los datos mediante GET -->
<form action="https://es.wikipedia.org/w/index.php" method="get">

    <!-- search: crea un campo de búsqueda -->
    <label for="busqueda">Buscar en Wikipedia:</label>
    <input type="search" id="busqueda" name="search" list="sugerencias">

    <!-- datalist: proporciona sugerencias para un campo de entrada -->
    <datalist id="sugerencias">

        <option value="Formulario web">
        <option value="HTML">
        <option value="Protocolo de transferencia de hipertexto">

    </datalist>

    <button type="submit">Buscar</button>

</form>

</body>
</html>
