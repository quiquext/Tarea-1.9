<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>

    <!-- form: crea un formulario para introducir y enviar datos; action: indica dónde se envían los datos; method: indica cómo se envían los datos -->
    <form action="index.html" method="get">

        <!-- fieldset: agrupa campos relacionados de un formulario -->
        <fieldset>

            <!-- legend: establece el título del grupo de campos -->
            <legend>Datos personales by Quique</legend>

        </fieldset>

    </form>

</body>
</html>
